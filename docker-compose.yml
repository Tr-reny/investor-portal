
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: invest
    ports: [ "5432:5432" ]
    volumes: [ "pg:/var/lib/postgresql/data" ]
  backend:
    build: ./backend
    env_file: ./backend/.env
    depends_on: [ db ]
    ports: [ "4000:4000" ]
  frontend:
    build: ./frontend
    env_file: ./frontend/.env
    depends_on: [ backend ]
    ports: [ "3000:3000" ]
volumes: { pg: {} }
